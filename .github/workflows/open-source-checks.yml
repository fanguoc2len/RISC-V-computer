name: Open Source Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check Python tools
        run: |
          python3 -m py_compile \
            scripts/gen_bootrom.py \
            scripts/gen_raw_boot_image.py \
            scripts/gen_offline_demo_data.py

      - name: Verify generated boot assets
        run: |
          python3 scripts/gen_bootrom.py \
            --output /tmp/bootrom.mem \
            --boot-image-output /tmp/boot_image.hex
          cmp bootrom.mem /tmp/bootrom.mem
          cmp boot_image.hex /tmp/boot_image.hex

  rtl-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install --yes verilator

      - name: Lint top-level RTL
        run: |
          verilator \
            --lint-only \
            --timing \
            -Wno-PINMISSING \
            -Wno-WIDTHTRUNC \
            -Wno-WIDTHEXPAND \
            --top-module top_basys3 \
            third_party/picorv32/picorv32.v \
            rtl/memory/*.v \
            rtl/peripherals/*.v \
            rtl/soc/*.v \
            rtl/top/*.v \
            rtl/video/*.v
